name: glintly_shop
description: A cross-platform Flutter e-commerce app with Supabase backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI and Navigation
  cupertino_icons: ^1.0.6
  go_router: ^13.2.0
  flutter_riverpod: ^2.4.9
  
  # Supabase
  supabase_flutter: ^2.3.4
  
  # HTTP and Storage
  http: ^1.2.0
  shared_preferences: ^2.2.2
  
  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  
  # Form handling
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700